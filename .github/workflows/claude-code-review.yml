name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed so the review can post a PR comment
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the adversarial-reviewer skill can diff against the base branch
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # Let the Bash tool authenticate `gh` for posting the review comment
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Enable the project setting source so the repo-vendored skills in
          # .claude/skills/ are discovered, and allow the Skill + Bash tools so
          # the skills (and their analyzer scripts / gh) can run.
          claude_args: |
            --setting-sources "project,user"
            --allowedTools "Skill,Bash,Read,Grep,Glob"
            --max-turns 40
          prompt: |
            You are performing an automated code review of pull request
            #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            The diff to review is the changes this PR introduces. Obtain it with:
              gh pr diff ${{ github.event.pull_request.number }}
            Read the full content of any changed file from the checked-out working
            tree when you need surrounding context — do not review only the changed
            lines.

            Review the changes in TWO passes, using BOTH repository-vendored skills:

            1. Invoke the `code-reviewer` skill (.claude/skills/code-reviewer) as the
               primary, language-aware review. Follow its loading order (universal
               rules + the matching languages/*.md for each changed file) and report
               complexity, risk, SOLID violations, and code smells.
            2. Invoke the `adversarial-reviewer` skill (.claude/skills/adversarial-reviewer)
               and run all three hostile personas (Saboteur, New Hire, Security
               Auditor) against the same changes, ending with its BLOCK / CONCERNS /
               CLEAN verdict.

            Then post ONE consolidated review as a single PR comment:
              gh pr comment ${{ github.event.pull_request.number }} --body-file <path>

            Structure the comment with two clearly separated sections:
              ## 🔍 Code Review (code-reviewer)
              ## 🗡️ Adversarial Review (adversarial-reviewer)
            and finish with the adversarial verdict.

            This is a review only — do not modify, stage, or commit any files.
