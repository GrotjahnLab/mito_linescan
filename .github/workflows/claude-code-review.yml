name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # track_progress posts/updates the review comment
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the skills can diff against the base branch
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action posts Claude's final response by creating/updating a single
          # tracking comment — no raw `gh` write is needed (and `gh` write
          # subcommands are denied by the action's permission layer anyway).
          track_progress: true
          # Enable the project setting source so the repo-vendored skills in
          # .claude/skills/ are discovered, and allow Skill + Bash so the skills
          # (and code-reviewer's analyzer scripts) can run.
          claude_args: |
            --setting-sources "project,user"
            --allowedTools "Skill,Bash,Read,Grep,Glob"
            --max-turns 40
          prompt: |
            Perform an automated code review of this pull request.

            The changes to review are this PR's diff against its base branch.
            Obtain them locally (the full history is checked out) with:
              git diff origin/${{ github.base_ref }}...HEAD
            Read the full content of any changed file for context — do not review
            only the changed lines.

            Review the changes in TWO passes, using BOTH repository-vendored skills:

            1. Invoke the `code-reviewer` skill (.claude/skills/code-reviewer) as the
               primary, language-aware review. Follow its loading order (universal
               rules + the matching languages/*.md for each changed file) and report
               complexity, risk, SOLID violations, and code smells.
            2. Invoke the `adversarial-reviewer` skill (.claude/skills/adversarial-reviewer)
               and run all three hostile personas (Saboteur, New Hire, Security
               Auditor), ending with its BLOCK / CONCERNS / CLEAN verdict.

            Present ONE consolidated review as your final response, with two
            clearly separated sections and the verdict at the end:
              ## 🔍 Code Review (code-reviewer)
              ## 🗡️ Adversarial Review (adversarial-reviewer)

            This is a review only — do not modify, stage, or commit any files.
